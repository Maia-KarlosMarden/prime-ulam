name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -e .[test]
      - name: Unit tests, paper checks and JS cross-check
        run: python -m pytest -q
      - name: Verify the formulas of the paper against the released code
        run: python3 -I src/verify/verify_article.py 37 127
      - name: Selftest CLI
        run: primeulam selftest
      - name: C decoder
        run: |
          gcc -O3 -o pudec src/decoder/pudec.c
          ./pudec data/codes/code_p37.txt 1024 20 0.10,0.15
