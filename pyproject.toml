[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "primeulam"
version = "0.1.0"
description = "Prime-Ulam LDPC: erasure codes generated from modular spirals (reference implementation and test harness)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
primeulam = "primeulam.cli:main"

[tool.setuptools]
packages = ["primeulam"]

[tool.setuptools.package-data]
primeulam = ["params/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical checks against the paper (a few seconds)"]
